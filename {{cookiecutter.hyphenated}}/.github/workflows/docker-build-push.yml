name: Build, Push and Deploy

on:
  push:
    branches: [ "main", "prod" ]
  pull_request:
    branches: [ "main", "prod" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: {% raw %}${{ github.repository }}{% endraw %}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ env.REGISTRY }}{% endraw %}
          username: {% raw %}${{ github.actor }}{% endraw %}
          password: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: {% raw %}${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}{% endraw %}
          tags: |
            type=sha
            type=raw,value=test,enable={% raw %}${{ github.ref == format('refs/heads/{0}', 'main') }}{% endraw %}
            type=raw,value=prod,enable={% raw %}${{ github.ref == format('refs/heads/{0}', 'prod') }}{% endraw %}
            type=raw,value=latest,enable={% raw %}${{ github.ref == format('refs/heads/{0}', 'prod') }}{% endraw %}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: {% raw %}${{ github.event_name != 'pull_request' }}{% endraw %}
          tags: {% raw %}${{ steps.meta.outputs.tags }}{% endraw %}
          labels: {% raw %}${{ steps.meta.outputs.labels }}{% endraw %}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: {% raw %}${{ env.REGISTRY }}{% endraw %}
          username: {% raw %}${{ github.actor }}{% endraw %}
          password: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Deploy to test environment
        if: github.ref == 'refs/heads/main'
        run: |
          cd /home/{{cookiecutter.github_username}}/{{cookiecutter.hyphenated}}-test
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose exec app /app/docker-start.sh collectstatic
          docker compose exec app /app/docker-start.sh migrate

      - name: Deploy to production environment
        if: github.ref == 'refs/heads/prod'
        run: |
          cd /home/{{cookiecutter.github_username}}/{{cookiecutter.hyphenated}}
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose exec app /app/docker-start.sh collectstatic
          docker compose exec app /app/docker-start.sh migrate
